
openapi: 3.0.3
info:
  title: AI Code Quality Auditor API
  version: 1.0.0
  description: >
    API contract for authentication and security. B2 submission and analysis
    endpoints will be specified separately before implementation.

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Authentication
    description: Registration, login, refresh-token rotation, and logout.
  - name: Users
    description: Current-user profile and account information.
  - name: Administration
    description: Administrator-only account and role management.
  - name: Operations
    description: Application health and operational endpoints.

paths:
  /api/v1/csrf:
    get:
      security: []
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Provision a CSRF token
      description: >
        Returns the token and header name and sets a readable XSRF-TOKEN
        cookie. Send the returned token in the X-XSRF-TOKEN header together
        with the cookie on state-changing requests.
      responses:
        '200':
          description: CSRF token provisioned
          headers:
            Set-Cookie:
              description: Readable CSRF token cookie (not the refresh token)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'

  /api/v1/auth/register:
    post:
      security: []
      tags: [Authentication]
      operationId: registerUser
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      security: []
      tags: [Authentication]
      operationId: loginUser
      summary: Authenticate and issue tokens
      description: >
        Sets the refresh_token HttpOnly cookie. The refresh token is never
        included in the JSON response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: HttpOnly refresh-token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid email or password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAccessToken
      summary: Rotate refresh token and issue a new access token
      description: >
        Requires refresh_token and XSRF-TOKEN cookies, the X-XSRF-TOKEN
        header, and a valid Origin. Rotates the refresh token atomically and sets a
        replacement cookie. Refresh tokens are never included in JSON.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/OriginHeader'
      security:
        - refreshCookie: []
          csrfCookie: []
      responses:
        '200':
          description: Refresh successful
          headers:
            Set-Cookie:
              description: Rotated HttpOnly refresh-token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutUser
      summary: Revoke refresh token and clear cookie
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/OriginHeader'
      security:
        - refreshCookie: []
          csrfCookie: []
      responses:
        '204':
          description: Logout successful; refresh cookie cleared
          headers:
            Set-Cookie:
              description: Expired refresh-token cookie
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Revocation failed; logout was unsuccessful and the refresh cookie was cleared
          headers:
            Set-Cookie:
              description: Expired refresh-token cookie
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{userId}/role:
    patch:
      tags: [Administration]
      operationId: changeUserRole
      summary: Change a user's role
      description: >
        Requires an authenticated administrator, the XSRF-TOKEN cookie, and
        the provisioned X-XSRF-TOKEN header. Rejects no-op changes,
        administrator self-demotion, and
        demotion of the last active administrator. Successful changes are
        audited in the same transaction as the role update.
      security:
        - bearerAuth: []
          csrfCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-XSRF-TOKEN
          in: header
          required: true
          description: Token returned by GET /api/v1/csrf.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleChangeRequest'
      responses:
        '200':
          description: Role changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /actuator/health:
    get:
      security: []
      tags: [Operations]
      operationId: getApplicationHealth
      summary: Check application health
      responses:
        '200':
          description: Application health response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
    csrfCookie:
      type: apiKey
      in: cookie
      name: XSRF-TOKEN

  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Token returned by GET /api/v1/csrf.
      schema:
        type: string
        example: 'provisioned-csrf-token'
    OriginHeader:
      name: Origin
      in: header
      required: true
      description: Must match a configured allowed frontend origin.
      schema:
        type: string
        format: uri

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          writeOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 100

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          writeOnly: true

    CsrfTokenResponse:
      type: object
      additionalProperties: false
      required: [token, headerName]
      properties:
        token:
          type: string
          description: Send this value in the header named by headerName.
        headerName:
          type: string
          enum: [X-XSRF-TOKEN]

    RoleChangeRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [USER, RESEARCHER, ADMIN]

    UserProfile:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [USER, RESEARCHER, ADMIN]

    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: Short-lived JWT access token.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Access-token lifetime in seconds.
          example: 900
        user:
          $ref: '#/components/schemas/UserProfile'

    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
      required: [type, title, status]

  responses:
    BadRequest:
      description: Invalid request or validation failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Request rejected by security policy
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Requested resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

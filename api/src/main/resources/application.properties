spring.application.name=auditor-api
auditor.analysis.scoring.version=complexity-v1
auditor.analysis.scoring.grade-a-minimum=90
auditor.analysis.scoring.grade-b-minimum=80
auditor.analysis.scoring.grade-c-minimum=70
auditor.analysis.scoring.grade-d-minimum=60
auditor.analysis.scoring.severity-deductions.INFO=0
auditor.analysis.scoring.severity-deductions.LOW=3
auditor.analysis.scoring.severity-deductions.MEDIUM=8
auditor.analysis.scoring.severity-deductions.HIGH=15
auditor.analysis.scoring.severity-deductions.CRITICAL=25
auditor.analysis.scoring.cyclomatic-threshold=10
auditor.analysis.scoring.cyclomatic-deduction-per-point=2
auditor.analysis.scoring.cyclomatic-maximum-deduction=20
auditor.analysis.scoring.cognitive-threshold=15
auditor.analysis.scoring.cognitive-deduction-per-point=1
auditor.analysis.scoring.cognitive-maximum-deduction=15

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auditor_db}
spring.datasource.username=${DB_USERNAME:auditor}
spring.datasource.password=${DB_PASSWORD:auditor}
spring.datasource.driver-class-name=org.postgresql.Driver
app.security.login-rate-limit.email-failures=${LOGIN_RATE_LIMIT_EMAIL_FAILURES:5}
app.security.login-rate-limit.ip-failures=${LOGIN_RATE_LIMIT_IP_FAILURES:30}
app.security.login-rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:900}
app.security.login-rate-limit.max-keys=${LOGIN_RATE_LIMIT_MAX_KEYS:10000}
app.security.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173}
app.jwt.secret=${APP_JWT_SECRET:}
# Maintainability analyzer thresholds
auditor.analysis.maintainability.long-method-statements=40
auditor.analysis.maintainability.max-parameters=5
auditor.analysis.maintainability.max-nesting-depth=4
auditor.analysis.maintainability.god-class-complexity=50
# Optional PMD analyzer
auditor.analysis.pmd.enabled=true
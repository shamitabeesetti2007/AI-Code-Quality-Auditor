services:
  postgres:
    image: postgres:16
    container_name: auditor-postgres
    environment:
      POSTGRES_DB: auditor_db
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: auditor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d auditor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
